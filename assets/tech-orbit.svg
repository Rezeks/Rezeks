.0" cy="345" r="3" fill="#b8a5ff"/><text x="351" y="351" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="550">Python</text></g><g><rect x="539.0" y="321.0" width="152" height="48" rx="12" fill="#121b24" stroke="#33414e"/><circle cx="554.0" cy="345" r="3" fill="#64d9e8"/><text x="621" y="351" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="550">FastAPI</text></g><g><rect x="749.0" y="291.0" width="152" height="48" rx="12" fill="#121b24" stroke="#33414e"/><circle cx="764.0" cy="315" r="3" fill="#64d9e8"/><text x="831" y="321" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="550">Go</text></g><text x="480.0" y="399" fill="#7e8c99" font-size="11" text-anchor="middle" letter-spacing="1.5" class="mono">TOOLS CONNECT. IDEAS TAKE SHAPE.</text></svg>
