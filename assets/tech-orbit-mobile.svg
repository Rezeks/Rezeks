<svg xmlns="http://www.w3.org/2000/svg" width="600" height="620" viewBox="0 0 600 620" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Rezeks — technology constellation</title><desc id="desc">A decorative animated map of technologies used in Rezeks projects: TypeScript, React, Next.js, Java, Spring Boot, Python, FastAPI and Go. The connections illustrate the stack, not a measured metric.</desc>
<defs>
  <radialGradient id="halo"><stop stop-color="#b8a5ff" stop-opacity=".15"/><stop offset="1" stop-color="#b8a5ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66863c"/><stop offset=".5" stop-color="#29333f"/><stop offset="1" stop-color="#746196"/></linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c8ff5f" stop-opacity=".28"/><stop offset="1" stop-color="#64d9e8" stop-opacity=".08"/></linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8a5ff" stop-opacity=".24"/><stop offset="1" stop-color="#b8a5ff" stop-opacity=".04"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#34404d" fill-opacity=".45"/></pattern>
  <clipPath id="frame"><rect x="1" y="1" width="598" height="618" rx="22"/></clipPath>
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
  .mono { font-family: 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
  .float { animation: float 6s ease-in-out infinite; }
  .float-reverse { animation: float 7s ease-in-out -3s infinite; }
  .orbit { animation: orbit 14s linear infinite; }
  .orbit-reverse { animation: orbit 20s linear reverse infinite; }
  .flow { animation: flow 8s linear infinite; }
  .glow { animation: glow 5s ease-in-out infinite; }
  .cursor { animation: blink 1.4s ease-in-out infinite; }
  .cmd1 { opacity: 1; animation: cmd1 18s linear infinite; }
  .cmd2 { opacity: 0; animation: cmd2 18s linear infinite; }
  .cmd3 { opacity: 0; animation: cmd3 18s linear infinite; }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-9px); } }
  @keyframes orbit { from { stroke-dashoffset:0; } to { stroke-dashoffset:-1000; } }
  @keyframes flow { from { stroke-dashoffset:0; } to { stroke-dashoffset:-360; } }
  @keyframes glow { 0%,100% { opacity:.3; } 50% { opacity:.7; } }
  @keyframes blink { 0%,100% { opacity:.3; } 50% { opacity:1; } }
  @keyframes cmd1 { 0%,2% { opacity:1; clip-path:inset(0 100% 0 0); } 12%,28% { opacity:1; clip-path:inset(0 0 0 0); } 32%,99.99% { opacity:0; clip-path:inset(0 0 0 0); } 100% { opacity:1; clip-path:inset(0 100% 0 0); } }
  @keyframes cmd2 { 0%,32% { opacity:0; clip-path:inset(0 100% 0 0); } 33% { opacity:1; clip-path:inset(0 100% 0 0); } 45%,61% { opacity:1; clip-path:inset(0 0 0 0); } 65%,100% { opacity:0; clip-path:inset(0 0 0 0); } }
  @keyframes cmd3 { 0%,65% { opacity:0; clip-path:inset(0 100% 0 0); } 66% { opacity:1; clip-path:inset(0 100% 0 0); } 78%,95% { opacity:1; clip-path:inset(0 0 0 0); } 99%,100% { opacity:0; clip-path:inset(0 0 0 0); } }
  @media (prefers-reduced-motion: reduce) { .float,.float-reverse,.orbit,.orbit-reverse,.flow,.glow,.cursor,.cmd1,.cmd2,.cmd3 { animation:none; } .cmd1 { opacity:1; clip-path:none; } .cmd2,.cmd3 { display:none; } }
  </style>
</defs>
<rect x="1" y="1" width="598" height="618" rx="22" fill="#0d1117" stroke="url(#edge)"/>
<g clip-path="url(#frame)"><rect x="300.0" y="1" width="300.0" height="618" fill="url(#grid)"/><circle cx="468.0" cy="279.0" r="434.0" fill="url(#halo)"/></g>
<text x="32" y="43" fill="#eef2f6" font-size="25" font-weight="650">The build constellation.</text><text x="32" y="72" fill="#a3b0bf" font-size="17">Web · mobile · backend</text><path d="M300 320 Q300 145 95 145" stroke="#c8ff5f" stroke-opacity=".18"/><path class="flow" style="animation-delay:-0s" d="M300 320 Q300 145 95 145" stroke="#c8ff5f" stroke-width="2" stroke-dasharray="12 348" stroke-linecap="round"/><path d="M300 320 Q300 145 505 145" stroke="#64d9e8" stroke-opacity=".18"/><path class="flow" style="animation-delay:-1s" d="M300 320 Q300 145 505 145" stroke="#64d9e8" stroke-width="2" stroke-dasharray="12 348" stroke-linecap="round"/><path d="M300 320 Q300 260 95 260" stroke="#b8a5ff" stroke-opacity=".18"/><path class="flow" style="animation-delay:-2s" d="M300 320 Q300 260 95 260" stroke="#b8a5ff" stroke-width="2" stroke-dasharray="12 348" stroke-linecap="round"/><path d="M300 320 Q300 260 505 260" stroke="#c8ff5f" stroke-opacity=".18"/><path class="flow" style="animation-delay:-3s" d="M300 320 Q300 260 505 260" stroke="#c8ff5f" stroke-width="2" stroke-dasharray="12 348" stroke-linecap="round"/><path d="M300 320 Q300 390 95 390" stroke="#c8ff5f" stroke-opacity=".18"/><path class="flow" style="animation-delay:-4s" d="M300 320 Q300 390 95 390" stroke="#c8ff5f" stroke-width="2" stroke-dasharray="12 348" stroke-linecap="round"/><path d="M300 320 Q300 390 505 390" stroke="#b8a5ff" stroke-opacity=".18"/><path class="flow" style="animation-delay:-5s" d="M300 320 Q300 390 505 390" stroke="#b8a5ff" stroke-width="2" stroke-dasharray="12 348" stroke-linecap="round"/><path d="M300 320 Q300 505 95 505" stroke="#64d9e8" stroke-opacity=".18"/><path class="flow" style="animation-delay:-6s" d="M300 320 Q300 505 95 505" stroke="#64d9e8" stroke-width="2" stroke-dasharray="12 348" stroke-linecap="round"/><path d="M300 320 Q300 505 505 505" stroke="#64d9e8" stroke-opacity=".18"/><path class="flow" style="animation-delay:-7s" d="M300 320 Q300 505 505 505" stroke="#64d9e8" stroke-width="2" stroke-dasharray="12 348" stroke-linecap="round"/><circle cx="300" cy="320" r="84" stroke="#34404d" stroke-dasharray="2 6"/><circle class="orbit" cx="300" cy="320" r="84" stroke="#b8a5ff" stroke-width="2" stroke-dasharray="24 150 3 250"/><circle cx="300" cy="320" r="65" fill="#131c24" stroke="#5d7841"/><circle class="glow" cx="300" cy="320" r="58" stroke="#c8ff5f" stroke-opacity=".25"/><text x="300" y="319" fill="#c8ff5f" font-size="23" text-anchor="middle" font-weight="700">REZEKS</text><text x="300" y="342" fill="#9dadba" font-size="12" text-anchor="middle" letter-spacing="2" class="mono">BUILD LAB</text><g><rect x="20.0" y="117.0" width="150" height="56" rx="12" fill="#121b24" stroke="#33414e"/><circle cx="35.0" cy="145" r="3" fill="#c8ff5f"/><text x="101" y="151" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="550">TypeScript</text></g><g><rect x="430.0" y="117.0" width="150" height="56" rx="12" fill="#121b24" stroke="#33414e"/><circle cx="445.0" cy="145" r="3" fill="#64d9e8"/><text x="511" y="151" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="550">React</text></g><g><rect x="20.0" y="232.0" width="150" height="56" rx="12" fill="#121b24" stroke="#33414e"/><circle cx="35.0" cy="260" r="3" fill="#b8a5ff"/><text x="101" y="266" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="550">Next.js</text></g><g><rect x="430.0" y="232.0" width="150" height="56" rx="12" fill="#121b24" stroke="#33414e"/><circle cx="445.0" cy="260" r="3" fill="#c8ff5f"/><text x="511" y="266" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="550">Java</text></g><g><rect x="20.0" y="362.0" width="150" height="56" rx="12" fill="#121b24" stroke="#33414e"/><circle cx="35.0" cy="390" r="3" fill="#c8ff5f"/><text x="101" y="396" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="550">Spring Boot</text></g><g><rect x="430.0" y="362.0" width="150" height="56" rx="12" fill="#121b24" stroke="#33414e"/><circle cx="445.0" cy="390" r="3" fill="#b8a5ff"/><text x="511" y="396" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="550">Python</text></g><g><rect x="20.0" y="477.0" width="150" height="56" rx="12" fill="#121b24" stroke="#33414e"/><circle cx="35.0" cy="505" r="3" fill="#64d9e8"/><text x="101" y="511" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="550">FastAPI</text></g><g><rect x="430.0" y="477.0" width="150" height="56" rx="12" fill="#121b24" stroke="#33414e"/><circle cx="445.0" cy="505" r="3" fill="#64d9e8"/><text x="511" y="511" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="550">Go</text></g><text x="300.0" y="599" fill="#7e8c99" font-size="15" text-anchor="middle" letter-spacing="1.5" class="mono">TOOLS CONNECT. IDEAS TAKE SHAPE.</text></svg>
