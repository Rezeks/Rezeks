<rect x="78" width="89" height="28" rx="7" fill="#18222b" stroke="#34404d"/><text x="122.5" y="19" text-anchor="middle" fill="#c4cdd6" font-size="12" class="mono">MOBILE</text>
<rect x="177" width="97" height="28" rx="7" fill="#18222b" stroke="#34404d"/><text x="225.5" y="19" text-anchor="middle" fill="#c4cdd6" font-size="12" class="mono">BACKEND</text>
</g><g transform="translate(745 141) scale(0.88)">
<ellipse cy="80" rx="130" ry="32" fill="#c8ff5f" fill-opacity=".025" stroke="#536a36" stroke-opacity=".35"/>
<ellipse class="orbit" cy="80" rx="130" ry="32" stroke="#c8ff5f" stroke-width="2" stroke-dasharray="20 70 5 140 10 125"/>
<g class="float">
<path d="M0-76 76-36 0 4-76-36Z" fill="url(#top)" stroke="#b4e95b" stroke-opacity=".8"/>
<path d="M-76-36 0 4V92L-76 52Z" fill="#64d9e8" fill-opacity=".08" stroke="#64d9e8" stroke-opacity=".55"/>
<path d="M0 4 76-36V52L0 92Z" fill="url(#side)" stroke="#b8a5ff" stroke-opacity=".7"/>
<path d="M0-52 52-25 0 2-52-25Z" stroke="#c8ff5f" stroke-opacity=".28"/>
<path d="M0-27 26-13 0 1-26-13Z" fill="#c8ff5f" fill-opacity=".18" stroke="#c8ff5f"/>
<path class="flow" d="M-76-36 0 4 76-36 M0 4V92" stroke="#eef2f6" stroke-width="2" stroke-dasharray="10 350"/>
<path d="m-53 2 12 7v21l-12-7M-25 17l12 7v21l-12-7" stroke="#64d9e8" stroke-width="2" stroke-opacity=".75"/>
