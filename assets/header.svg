</g>
<g transform="rotate(-24)"><ellipse cy="0" rx="148" ry="38" stroke="#b8a5ff" stroke-opacity=".17"/><ellipse class="orbit-reverse" cy="0" rx="148" ry="38" stroke="#b8a5ff" stroke-width="2" stroke-dasharray="30 250 4 200 12 200"/></g>
<circle class="glow" cx="-115" cy="-72" r="3" fill="#64d9e8"/>
<circle class="glow" cx="126" cy="-45" r="4" fill="#c8ff5f"/>
<path class="float-reverse" d="m-128 22 10-6 10 6-10 6Z" fill="#b8a5ff" fill-opacity=".5"/>
</g><g transform="translate(42 276)">
<rect width="876" height="82" rx="12" fill="#10171f" stroke="#303d49"/>
<circle cx="18" cy="17" r="3.5" fill="#c8ff5f"/><circle cx="31" cy="17" r="3.5" fill="#b8a5ff"/><circle cx="44" cy="17" r="3.5" fill="#64d9e8"/>
<text x="858" y="21" text-anchor="end" fill="#8f9eac" font-size="11" letter-spacing="1" class="mono">REZEKS / BUILD LOG</text>
<path d="M0 32H876" stroke="#25323d"/>
<text x="18" y="62" font-size="18" fill="#c8ff5f" class="mono">$</text>
<text class="mono cmd1" x="44" y="62" fill="#eef2f6" font-size="18">design interfaces();</text><text class="mono cmd2" x="44" y="62" fill="#eef2f6" font-size="18">connect the backend();</text><text class="mono cmd3" x="44" y="62" fill="#eef2f6" font-size="18">build. learn. repeat.</text>
<rect class="cursor" x="844" y="47" width="8" height="18" fill="#c8ff5f"/>
</g></svg>
